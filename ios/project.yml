name: Gweilo
options:
  bundleIdPrefix: com.ivantomicic
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Gweilo:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Gweilo
        excludes:
          - Resources/Assets.xcassets
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo
        PRODUCT_NAME: Gweilo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Gweilo/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GweiloTests
  GweiloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GweiloTests
    dependencies:
      - target: Gweilo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
