name: Gweilo
options:
  bundleIdPrefix: com.ivantomicic
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Gweilo:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        com.apple.Push:
          enabled: 1
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Gweilo
        excludes:
          - Resources/Info.plist
          - Resources/GweiloIcon.icon
      - path: Gweilo/Resources/GweiloIcon.icon
        type: file
        buildPhase: resources
        group: Gweilo/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: GweiloIcon
        CODE_SIGN_ENTITLEMENTS: Gweilo/Gweilo.entitlements
        DEVELOPMENT_TEAM: 5JKSYD4AUC
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo
        PRODUCT_NAME: Gweilo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Gweilo/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - GweiloTests
    dependencies:
      - target: GweiloLiveActivity
        embed: true
      - target: GweiloWatch
        embed: true
  GweiloWatch:
    type: application
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: GweiloWatch
        excludes:
          - Info.plist
      - path: Gweilo/Models/GweiloWidgetSnapshot.swift
      - path: Gweilo/Resources/GweiloIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: GweiloWatchWidgets
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: GweiloIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: GweiloWatch/GweiloWatch.entitlements
        DEVELOPMENT_TEAM: 5JKSYD4AUC
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo.watchkitapp
        PRODUCT_NAME: GweiloWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GweiloWatch/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SKIP_INSTALL: YES
    scheme: {}
  GweiloWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: GweiloWatchWidgets
        excludes:
          - Info.plist
      - path: Gweilo/Models/GweiloWidgetSnapshot.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: GweiloWatchWidgets/GweiloWatchWidgets.entitlements
        DEVELOPMENT_TEAM: 5JKSYD4AUC
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo.watchkitapp.widgets
        PRODUCT_NAME: GweiloWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GweiloWatchWidgets/Info.plist
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  GweiloLiveActivity:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: GweiloLiveActivity
        excludes:
          - Info.plist
      - path: Gweilo/LiveActivities/GweiloSessionActivityAttributes.swift
      - path: Gweilo/Models/GweiloWidgetSnapshot.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: GweiloLiveActivity/GweiloLiveActivity.entitlements
        DEVELOPMENT_TEAM: 5JKSYD4AUC
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo.LiveActivity
        PRODUCT_NAME: GweiloLiveActivity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GweiloLiveActivity/Info.plist
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1"
  GweiloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GweiloTests
    dependencies:
      - target: Gweilo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivantomicic.gweilo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
